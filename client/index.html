<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b1a" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cartoon Clash" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Cartoon Clash: Legends of Childhood. A 2D 1v1 arcade fighter in your browser. Training, Arcade, Local Versus and Online." />
    <title>Cartoon Clash: Legends of Childhood</title>
    <link rel="preload" href="/fonts/Bungee-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b1a'/%3E%3Cpath d='M38 6 16 36h14l-6 22 24-32H34z' fill='%23ff8a1f' stroke='%2322e4ff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      html, body { margin: 0; height: 100%; background: #070b1a; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; color: #22e4ff;
        font: 700 14px/1 system-ui, sans-serif; letter-spacing: .3em; text-transform: uppercase; }
      .boot span { animation: boot-pulse 1.2s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { opacity: .35; } }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot"><span>Loading</span></div></div>
    <noscript>Cartoon Clash needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
