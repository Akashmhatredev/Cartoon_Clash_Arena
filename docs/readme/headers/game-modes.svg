.tt,.eb,.bd,.acc{transform-box:fill-box;transform-origin:center}
.tt{animation:slide .5s cubic-bezier(0.2,0.8,0.2,1) both}
.eb{animation:slide .5s .08s cubic-bezier(0.2,0.8,0.2,1) both}
.bd{animation:fade .5s .3s cubic-bezier(0.2,0.8,0.2,1) both}
.acc{animation:grow .5s cubic-bezier(0.2,0.8,0.2,1) both;transform-origin:center top}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
.glint{animation:glint 6s 1s linear infinite}
@keyframes glint{0%{transform:translateX(0)}30%,100%{transform:translateX(1460px)}}</style>
